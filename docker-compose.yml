services:
  # Cơ sở dữ liệu đồ thị Neo4j
  neo4j:
    image: neo4j:5.26-community
    container_name: social_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web Interface
      - "7687:7687" # Bolt Protocol cho Backend kết nối
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/import
      - ./data/neo4j/plugins:/plugins
    restart: unless-stopped

  # Cơ sở dữ liệu tài liệu MongoDB
  mongodb:
    image: mongo:7.0
    container_name: social_mongodb
    ports:
      - "27017:27017" # Port kết nối MongoDB
    volumes:
      - ./data/mongodb:/data/db
    restart: unless-stopped
